"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
final_space = true
version = 4

[[blocks]]
alignment = "left"
type = "prompt"

# [[blocks.segments]]
# foreground = "blue"
# style = "plain"
# template = " {{ .UserName }}@{{ .HostName }}"
# type = "session"

[[blocks.segments]]
foreground = "blue"
style = "plain"
template = " {{ .Path }}"
type = "path"

[blocks.segments.options]
folder_icon = ".."
home_icon = "~"
style = "agnoster_short"

[[blocks.segments]]
foreground = "magenta"
template = " {{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}*{{ end }}"
style = "plain"
type = "git"

[blocks.segments.options]
branch_icon = " "
cherry_pick_icon = " "
commit_icon = " "
merge_icon = " "
no_commits_icon = " "
rebase_icon = " "
revert_icon = " "
tag_icon = " "

[[blocks.segments]]
style = "plain"
foreground = "lightGreen"
template = " "
type = "text"

[transient_prompt]
foreground = "lightGreen"
template = "  "
