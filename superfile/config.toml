# Options
editor = "" # Default: $EDITOR
dir_editor = ""
auto_check_update = true
cd_on_quit = true
default_open_file_preview = true
show_image_preview = true
show_panel_footer_info = true
default_directory = "."

# true: SI decimal units of 1000 (kB, MB, GB).
# false: IEC binary units of 1024 (KiB, MiB, GiB).
file_size_use_si = false

# (0: Name, 1: Size, 2: Date Modified, 3: Type, 4: Natural).
# Natural sort treats numeric sequences as numbers (e.g., file2 before file10).
default_sort_type = 0

# true: Descending.
# false: Ascending.
sort_order_reversed = false

case_sensitive_sort = false
shell_close_on_success = false
page_scroll_size = 0
debug = false
ignore_missing_fields = true
file_panel_extra_columns = 0

# Percentage of file panel width allocated to file names (25-100).
# Higher values give more space to names, less to extra columns.
file_panel_name_percent = 50

#-- Theme
theme = "catppuccin-mocha"
code_previewer = ""
nerdfont = true
show_select_icons = true
transparent_background = false

# Width of the file preview panel will be 1/n of the total width.
# Values recommended to be in 2–10.
# Default (0): Use the same width as file picker panel.
file_preview_width = 0
enable_file_preview_border = false
sidebar_width = 20
sidebar_sections = ["pinned", "home", "disks"]
border_top = '─'
border_bottom = '─'
border_left = '│'
border_right = '│'
border_top_left = '╭'
border_top_right = '╮'
border_bottom_left = '╰'
border_bottom_right = '╯'
border_middle_left = '├'
border_middle_right = '┤'
